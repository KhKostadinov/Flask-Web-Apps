{% extends "layout.html" %}

{% block content %}
<div id="q3_2" style="margin-top: 1%;margin-bottom: 1%;">
	<form action="/q3_2" method="POST">
        <label for="q3_2">{{ q_text }}</label><br>
        {% for option in q_options %}
            <span>{{ option }}</span>
            <select name="Q3_2" class="form-select form-select-sm" aria-label=".form-select-sm example">
                <option value="1">1 - Least satisfied</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10 - Most satisfied</option>
            </select>
        {% endfor %}
        <input type="submit" value="Submit" style="margin-top: 3px; margin-bottom: 3px;"/>
    </form>


</div>
    {% with messages3 = get_flashed_messages() %}
        {% if messages3 %}
            {% for message3 in messages3 %}
                {{ message3 }}
            {% endfor %}
        {% endif %}
    {% endwith %}
<br>
<a role="button" class="btn btn-outline-dark" style="margin-top: 3px; margin-bottom: 5px;" href="{{ url_for('home') }}">Return to home page.</a>
{% endblock %}
