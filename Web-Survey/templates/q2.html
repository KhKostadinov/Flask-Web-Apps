{% extends "layout.html" %}

{% block content %}
<div id="q2" style="margin-top: 1%;margin-bottom: 1%;">
	<form action="/q2" method="POST">
        <label for="q2">{{ q_text }}</label><br>
        {% for option,id in q_options|zip(q_id) %}
            <input class="form-check-input" type="radio" name="Q2_radio" id="Q2_option" value={{ id }} >
            <label class="form-check-label" for="Q2_option">
                {{ option }}
            </label><br>
        {% endfor %}
            <input type="submit" value="Submit" style="margin-top: 3px; margin-bottom: 3px;"/>
    </form>
</div>
    {% with messages2 = get_flashed_messages() %}
        {% if messages2 %}
            {% for message2 in messages2%}
                {{ message2 }}
            {% endfor %}
        {% endif %}
    {% endwith %}
<br>
<a role="button" class="btn btn-outline-dark" style="margin-top: 3px; margin-bottom: 5%;" href="{{ url_for('home') }}">Return to home page.</a>
{% endblock %}
