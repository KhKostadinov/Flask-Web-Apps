<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css')}}" />
    <title>PyMonkey RAG</title>
</head>
<body>
<div class="container">
  <h1>RAG System</h1>

  <!-- Main form -->
  <form action="/" method="post" enctype="multipart/form-data">
    <div>
        <label for="documents">Upload Documents (PDF, DOCX, TXT, etc.)</label>
        <input id="documents" name="documents" type="file" accept=".pdf,.docx,.txt" multiple>
    </div>
    <div clas="btn-group">
        <button type="submit" class="submit-btn">Upload file</button>
        <a href="{{ url_for('rag') }}" class="submit-btn">Open RAG</a>
    </div>
  </form>

{% block content %}{% endblock %}

</body>
</html>
